name: Backend safety suite

on:
  workflow_dispatch:
  push:
    branches:
      - fix/stripe-connect-accounts-v2
    paths:
      - 'server.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/backend-safety.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run full backend suite with bounded execution
        run: timeout --signal=TERM --kill-after=15s 8m node --test --test-concurrency=1 --test-reporter=spec tests/*.test.js
