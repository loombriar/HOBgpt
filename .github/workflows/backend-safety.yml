name: Backend safety suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/backend-safety.yml'
  push:
    branches:
      - main
      - 'security/admin-mfa-*'
      - 'security/admin-totp-*'
    paths:
      - 'server.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/backend-safety.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run full backend suite with bounded execution
        run: timeout --signal=TERM --kill-after=15s 8m node --test --test-concurrency=1 --test-reporter=spec tests/*.test.js
