name: Android unsigned verification
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'apps/default/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'apps/default/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify Android SDK installation
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"
          echo "Android API 36 SDK and build tools installed"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/default
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Build bundled website
        run: npm run build:web
        working-directory: mobile
      - name: Generate native Android project
        run: npx cap add android
        working-directory: mobile
      - name: Configure edge-to-edge system bars
        run: npm run android:configure
        working-directory: mobile
      - name: Verify target API
        run: npm run android:verify
        working-directory: mobile
      - name: Sync native plugins
        run: npx cap sync android
        working-directory: mobile
      - name: Build unsigned release and debug APK
        run: ./gradlew assembleDebug bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-builds
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
