name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install marketplace dependencies
        working-directory: apps/default
        run: npm install --no-package-lock
      - name: Test marketplace
        working-directory: apps/default
        run: npm test
      - name: Build marketplace
        working-directory: apps/default
        run: npm run build
