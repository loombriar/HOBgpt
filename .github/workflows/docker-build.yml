name: Docker build verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - apps/default/package.json
      - apps/default/package-lock.json
      - .github/workflows/docker-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build using Amazon ECR Public Node image
        run: |
          # ECR Public occasionally returns 429; fall back to Docker Hub.
          if ! docker build --pull --tag house-of-briar:ci .; then
            echo "::warning::ECR Public image pull/build failed; retrying using Docker Hub Node image"
            sed 's#public.ecr.aws/docker/library/node:20-bookworm-slim#node:20-bookworm-slim#g' Dockerfile > Dockerfile.ci-fallback
            docker build --pull --file Dockerfile.ci-fallback --tag house-of-briar:ci .
          fi
      - name: Verify mounted SQLite directory is writable by non-root process
        run: |
          mkdir -p "${RUNNER_TEMP}/hob-volume-check"
          chmod 755 "${RUNNER_TEMP}/hob-volume-check"
          docker run --rm --user 0:0 -e DATA_DIR=/data \
            -v "${RUNNER_TEMP}/hob-volume-check:/data" \
            --entrypoint /bin/sh house-of-briar:ci -c \
            'touch /data/owned-by-root && chmod 600 /data/owned-by-root'
          docker run --rm -e DATA_DIR=/data \
            -v "${RUNNER_TEMP}/hob-volume-check:/data" \
            house-of-briar:ci node -e \
            'const fs=require("fs");fs.appendFileSync("/data/owned-by-root","ok");fs.writeFileSync("/data/new-file","ok");if(process.getuid()!==1000)process.exit(1)'
