name: Docker build verification
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - apps/default/package.json
      - apps/default/package-lock.json
      - .github/workflows/docker-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build using Amazon ECR Public Node image
        run: docker build --pull --tag house-of-briar:ci .
