name: Android signed release (manual)
on:
  workflow_dispatch:
concurrency:
  group: android-signed-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
        working-directory: apps/default
      - run: npm install --no-audit --no-fund
        working-directory: mobile
      - run: npm run build:web
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - run: npm run android:verify && npx cap sync android
        working-directory: mobile
      - name: Configure signing from GitHub Actions secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "Missing required Android signing secret: $key" >&2; exit 1; fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-upload.jks
          chmod 600 mobile/android/app/release-upload.jks
          cat >> mobile/android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  releaseUpload {
                      storeFile file('release-upload.jks')
                      storePassword System.getenv('SIGNING_STORE_PASSWORD')
                      keyAlias System.getenv('SIGNING_KEY_ALIAS')
                      keyPassword System.getenv('SIGNING_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.releaseUpload }
              }
          }
          GRADLE
      - name: Build and verify signed release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          set -euo pipefail
          ./gradlew bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict -certs \
            -keystore app/release-upload.jks \
            -storepass:env SIGNING_STORE_PASSWORD \
            "$AAB" "$SIGNING_KEY_ALIAS"
          keytool -printcert -jarfile "$AAB" | grep -E 'SHA256:|Owner:'
      - name: Remove signing keystore
        if: always()
        run: rm -f mobile/android/app/release-upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
